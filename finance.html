<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="CSS/finance.css">
</head>
<body>

  <div class="app-container">
    
    <div class="status-bar">
      <a href="dashboard.html" class="back-link">← Kembali ke Dashboard</a>
      <div class="status-icons">
        <div class="icon-placeholder"></div>
        <div class="icon-placeholder"></div>
      </div>
    </div>

    <header class="app-header">
      <div class="user-avatar"></div>
      <div class="notification-icon"></div>
    </header>

    <section class="balance-section">
      <span class="label">Total balance</span>
      <h1 class="balance-amount">Rp 1,000<span class="cents">.00</span></h1>
      
      <div class="action-buttons">
        <button class="btn btn-primary">Send</button>
        <button class="btn btn-secondary">Request</button>
      </div>
    </section>

    <section class="spending-section">
      <div class="spending-card">
        <span class="label">Spending</span>
        <h2 class="spending-amount">Rp1,000</h2>
      </div>
    </section>

  </div>

</body>
</html>
