<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="CSS/finance.css">
</head>
<body>

  <div class="app-container">
    
    <div class="status-bar">
      <a href="dashboard.html" class="back-link">Kembali ke Dashboard</a>
      <div class="status-icons">
        <div class="icon-placeholder"></div>
        <div class="icon-placeholder"></div>
      </div>
    </div>

    <header class="app-header">
      <div class="user-avatar"></div>
      <div class="notification-icon"></div>
    </header>

    <section class="balance-section">
      <span class="label">Total balance</span>
      <h1 id="balance" class="balance-amount">Rp 1,000<span class="cents">.00</span></h1>
      
      <div class="action-buttons">
        <button id="incomeBtn" class="btn btn-primary">Income</button>
        <button id="expenseBtn" class="btn btn-secondary">Expense</button>
      </div>
    </section>

    <section class="spending-section">
      <div class="spending-card">
        <span class="label">Spending</span>
        <h2 class="spending-amount">Rp1,000</h2>
      </div>
    </section>

    <section class="history-section">
      
      <h3>Recent Transaction</h3>

      <div id="historyList">
        
      </div>
    </section>

  </div>

  <div id="modal" class="modal">

    <div class="modal-content">
      <h2>Input Nominal</h2>
      
      <input id="amountInput" type="number" placeholder="Masukkan Nominal">

      <select id="categoryInput">
        <option value="">Pilih Kategori</option>
        <option value="Gaji">Gaji</option>
        <option value="Freelance">Freelance</option>
        <option value="Saham">Saham</option>
        <option value="Bonus">Bonus</option>
        <option value="Makan">Makan</option>
        <option value="Transport">Transport</option>
      </select>

      <select id="accountInput">
        <option value="">Pilih Account</option>
        <option value="Cash">Cash</option>
        <option value="Bank Jago">Bank Jago</option>
        <option value="BCA">BCA</option>
        <option value="DANA">DANA</option>
      </select>
      
      <div class="modal-button">

        <button id="cancelBtn">Batal</button>

        <button id="saveBtn">Simpan</button>

      </div>

    </div>

  </div>

  <script src="JS/finance.js"></script>
</body>
</html>
